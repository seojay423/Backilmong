<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Qterw-E-63 | 안녕 교통정보</title>
<style>
:root {
  --bg:#0b0f14;
  --ink:#e9edf3;
  --accent:#ff5e57;
}
body {
  background:var(--bg);
  color:var(--ink);
  font-family:"Pretendard",system-ui,sans-serif;
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}
.radio {
  width:260px; height:180px;
  border:2px solid #222;
  border-radius:16px;
  background:linear-gradient(#1a1f27,#0e1013);
  box-shadow:0 0 40px #000 inset,0 0 12px #ff5e5715;
  position:relative;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .3s ease;
}
.radio:hover {
  box-shadow:0 0 40px #ff5e5720 inset,0 0 20px #ff5e5730;
}
.radio::before {
  content:"";
  position:absolute;inset:0;
  background:url('https://upload.wikimedia.org/wikipedia/commons/2/25/CRT_static.gif');
  opacity:0;pointer-events:none;
  transition:opacity .3s ease;
}
.radio.active::before { opacity:.25; }

.speaker {
  width:70%;height:60%;
  border-radius:8px;
  background:repeating-radial-gradient(circle at center,#15181d 0 1px,#0b0e12 2px);
  box-shadow:inset 0 0 10px #000;
}

.screen {
  margin-top:30px;
  width:80%;max-width:500px;
  min-height:80px;
  background:#10141a;
  border:1px solid #1d222b;
  border-radius:10px;
  padding:16px;
  font-size:14px;
  line-height:1.6;
  box-shadow:0 0 12px #000 inset;
  text-align:center;
  white-space:pre-wrap;
  opacity:0;
  transition:opacity .6s ease;
}
.screen.show { opacity:1; }

h1 {
  font-size:18px;
  font-weight:600;
  margin-bottom:8px;
  opacity:.85;
}
.code {font-size:12px;opacity:.5;margin-top:8px;}

/* 붉은 경고 연출 */
.glitch {
  position:absolute;
  inset:0;
  background:url('https://upload.wikimedia.org/wikipedia/commons/2/25/CRT_static.gif');
  mix-blend-mode:screen;
  opacity:0.6;
  pointer-events:none;
  animation:glow .08s infinite alternate;
  border-radius:inherit;
}
@keyframes glow {
  from { filter:hue-rotate(0deg) brightness(1); }
  to { filter:hue-rotate(45deg) brightness(2); }
}

/* 붉은 텍스트 등장 */
.screen.alert {
  color:#ff4b4b;
  font-weight:700;
  text-shadow:0 0 8px #ff0000aa;
  font-size:22px;
  letter-spacing:3px;
}

/* 라디오 녹아내림 */
@keyframes melt {
  0% { transform:scale(1) rotate(0deg); opacity:1; filter:none; }
  40% { transform:scale(1.05) skewY(3deg); filter:hue-rotate(20deg) brightness(1.5); }
  100% { transform:translateY(120px) scaleX(1.2) scaleY(0.1); opacity:0; filter:blur(8px) brightness(0.2); }
}
.radio.melting {
  animation:melt 2.2s ease-in forwards;
}
</style>
</head>
<body>
    <script>
  (function(){
    // 로그인 페이지에서 bgm_enabled가 true일 경우
    if (sessionStorage.getItem("bgm_enabled") === "1" && !window.__BGM_AUDIO__) {
      const audio = new Audio("assets/music.mp3");
      audio.loop = true;
      audio.volume = 0.4;

      // 이전 재생 위치 복원
      const last = Number(sessionStorage.getItem("bgm_time") || 0);
      if (isFinite(last) && last > 0) audio.currentTime = last;

      audio.play().then(()=>{
        console.log("🎧 메인 페이지에서 이어서 재생됨");
      }).catch(()=>{
        console.log("🔇 자동재생 차단됨 (사용자 상호작용 필요)");
      });

      // 진행도 계속 저장
      audio.addEventListener("timeupdate", ()=>{
        sessionStorage.setItem("bgm_time", audio.currentTime);
      });

      window.__BGM_AUDIO__ = audio;
    }
  })();
  </script> 

  <h1>Qterw-E-63</h1>
  <div class="radio" id="radio">
    <div class="speaker"></div>
  </div>
  <div class="screen" id="screen"></div>

const warning = [
  "오늘은 우연히 만나는 사람의 말을 조심하세요. 작은 농담이 오해로 번질 수 있습니다.",

  "오늘은 신호를 두 번 기다리세요. 첫 번째는 당신을 위한 게 아닙니다.",

  "지하도로 진입 전, 거울을 확인하세요. 돌아오는 출구가 하나 줄었을지도 모릅니다.",

  "교차로에서 낯선 음악이 들린다면, 브레이크를 밟지 마세요. 그건 멈추라는 신호가 아닙니다.",

const screen = document.getElementById("screen");
const radio = document.getElementById("radio");
let clickCount = 0;

function randomPick() {
  const roll = Math.random();
  if (roll < 0.15) {
    const msg = warning[Math.floor(Math.random() * warning.length)];
    return `안녕하세요! 생생 교통예보입니다.\n현재 서울시의 출근길 도로 상황은...\n\n${msg}`;
  } else {
    const msg = normal[Math.floor(Math.random() * normal.length)];
    return `안녕하세요! 생생 교통예보입니다.\n현재 서울시의 출근길 도로 상황은...\n\n${msg}`;
  }
}

function playNoise(){
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const buffer = ctx.createBuffer(1, ctx.sampleRate * 1.2, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i=0;i<data.length;i++) data[i] = Math.random()*2-1;
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  noise.connect(ctx.destination);
  noise.start();
}

// ★ 타이핑 효과 함수
function typeText(el, text, delay=160) {
  el.textContent = "";
  let i = 0;
  const timer = setInterval(()=>{
    el.textContent += text[i];
    i++;
    if (i >= text.length) clearInterval(timer);
  }, delay);
}

radio.addEventListener("click", ()=>{
  clickCount++;

  // ★ 4번째 클릭 시 경고 시퀀스
  if (clickCount === 4) {
    radio.insertAdjacentHTML('beforeend','<div class="glitch"></div>');
    playNoise();
    screen.className = "screen show alert";
    typeText(screen, "듣 지 마", 280);
    setTimeout(()=>{
      radio.classList.add("melting");
      setTimeout(()=>{
        radio.style.display="none";
        screen.textContent = "";
        screen.classList.remove("alert");
      }, 2200);
    }, 2000);
    return;
  }

  // 일반 작동
  radio.classList.add("active");
  playNoise();
  screen.classList.remove("show");
  setTimeout(()=>{
    screen.textContent = randomPick();
    screen.classList.add("show");
  }, 900);
  setTimeout(()=> radio.classList.remove("active"), 2000);
});
</script>
