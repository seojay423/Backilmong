<style>
  :root{
    --bg:#0b0f14; --ink:#e9edf3; --red:#ff3b30; --muted:#8b93a7;
  }
  body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,Pretendard,Roboto}
  .wrap{min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid #161b24;background:#0c1118}
  header a{color:#f25f5c;text-decoration:none}
  header .code{margin-left:auto;opacity:.7;font-size:12px;letter-spacing:.08em}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:20px}
  .hint{opacity:.7;font-size:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;justify-items:center}

  /* 카드 */
  .card{
    width:min(280px, 60vw); aspect-ratio:6/11; max-width:60mm; max-height:110mm;
    background:#000;border:1px solid #151515; border-radius:12px; position:relative;
    perspective:1200px; user-select:none;
  }
  .inner{ position:absolute; inset:0; transform-style:preserve-3d; transition:transform .7s cubic-bezier(.2,.8,.2,1); }
  .card.revealed .inner{ transform:rotateY(180deg); }
  .face{ position:absolute; inset:0; backface-visibility:hidden; border-radius:12px; overflow:hidden; }
  .face.back{ background:#000; }
  .face.front{
    transform:rotateY(180deg);
    background:#111213; border:1px solid #2a2f3a; display:flex; align-items:center; justify-content:center;
  }
  .face.front img{ width:100%; height:100%; object-fit:cover; transition:transform .25s ease; }
  .rev-toggle{
    position:absolute; right:8px; top:8px; display:flex; align-items:center; gap:6px;
    background:#0c1118; border:1px solid #2a2f3a; padding:6px 8px; border-radius:999px; font-size:12px; opacity:.9
  }
  .rev-toggle input{ accent-color:#ff5151; }
  .rev-on .face.front img{ transform:rotate(180deg); } /* 시각적 역방향 */

  .choose-bar{display:flex; gap:12px; margin-top:6px}
  .btn{padding:10px 14px; border:1px solid #2a2f3a; background:#0c1118; color:#e9edf3; border-radius:10px; cursor:pointer}
  .btn[disabled]{opacity:.4; cursor:not-allowed}
  .danger{border-color:#ff3b30;color:#ffb3ae}
  .badge{padding:2px 8px; border:1px solid #2a2f3a; border-radius:999px; font-size:12px}
  .badge.red{border-color:#ff3b30; color:#ff6b62}
  .muted{color:var(--muted)}
  .log{max-width:720px; width:100%; background:#0c1118; border:1px solid #161b24; border-radius:12px; padding:14px}
  .log h3{margin:.2em 0 .6em 0; font-size:14px; opacity:.8}
  .log pre{white-space:pre-wrap; word-break:break-word; font:12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color:#c9d1e1}
</style>
</head>

  <script>
  (function(){
    // 로그인 페이지에서 bgm_enabled가 true일 경우
    if (sessionStorage.getItem("bgm_enabled") === "1" && !window.__BGM_AUDIO__) {
      const audio = new Audio("assets/music.mp3");
      audio.loop = true;
      audio.volume = 0.4;

      // 이전 재생 위치 복원
      const last = Number(sessionStorage.getItem("bgm_time") || 0);
      if (isFinite(last) && last > 0) audio.currentTime = last;

      audio.play().then(()=>{
        console.log("🎧 메인 페이지에서 이어서 재생됨");
      }).catch(()=>{
        console.log("🔇 자동재생 차단됨 (사용자 상호작용 필요)");
      });

      // 진행도 계속 저장
      audio.addEventListener("timeupdate", ()=>{
        sessionStorage.setItem("bgm_time", audio.currentTime);
      });

      window.__BGM_AUDIO__ = audio;
    }
  })();
  </script>

/* ── 규칙(자정/디버그) */
const DEBUG = new URLSearchParams(location.search).get("debug"); // "on" or "HH:MM"
/* ── 자정 조건 확인 */
function isMidnight(){
  if (DEBUG==="on") return true;
  if (DEBUG && /^\d{1,2}:\d{2}$/.test(DEBUG)){
    const [h,m]=DEBUG.split(":").map(Number);
    const n=new Date();
    return n.getHours()===h && n.getMinutes()===m;
  }
  const now=new Date();
  return now.getHours()===0 && now.getMinutes()<2; // 자정~00:01까지만 허용
}


/* ── 월 1회 제한 */
function monthRange(){
  const n=new Date();
  return {
    start:new Date(n.getFullYear(),n.getMonth(),1,0,0,0).toISOString(),
    end:new Date(n.getFullYear(),n.getMonth()+1,1,0,0,0).toISOString()
  }
}
async function findThisMonthDraw(){
  const {start,end}=monthRange();
  const {data,error}=await sb.from("tarot_draws")
    .select("*").gte("created_at",start).lt("created_at",end)
    .eq("user_id",userId).order("created_at",{ascending:false}).limit(1);
  if(error){console.error(error);return null;}
  return data?.[0]||null;
}

/* ── 상태 */
let offered=null;     // [objA,objB]
let locked=false;
const revUiA = cardA.querySelector(".rev-toggle");
const revUiB = cardB.querySelector(".rev-toggle");

/* ── 유틸 */
function setRevealAbility(){
  const ok=isMidnight();
  revealBtn.disabled=!ok;
  ruleHint.textContent = ok
   ? "지금은 의식의 시간이 열려 있습니다. 뒤집을 수 있습니다."
   : "자정(00:00)에만 뒤집을 수 있습니다.";
  if (DEBUG) debugMsg.textContent = `DEBUG=${DEBUG} / ${new Date().toLocaleString()}`;
}
/* ── 통합 덱(전체 78장) ─────────────────────────────────────*/
const DECK = [...MAJOR, ...SWORDS, ...WANDS, ...CUPS, ...PENTACLES];

/* 기존 함수 교체 */
function pickTwo(){
  const i = Math.floor(Math.random()*DECK.length);
  let j; do { j = Math.floor(Math.random()*DECK.length); } while (j===i);
  return [ DECK[i], DECK[j] ];
}

function drawFaces(a,b){
  imgA.src = encodeURI(a.img); imgB.src = encodeURI(b.img);
  imgA.alt = a.name; imgB.alt = b.name;
}

/* ── 해석 출력 */
function buildReading(card, reversed){
  const title = `${card.name}${reversed?" (역방향)":""}`;
  const body = reversed ? card.rev : card.up;
  // 보너스: 일상형 결과 2줄
  const hintMap = {
    "The Moon":[
      "헷갈리던 문제가 드러나고 체크리스트를 만든다.",
      "이상한 꿈/기시감이 하루를 슬쩍 흔든다."
    ],
    "The Sun":[
      "뚜렷한 진척/칭찬/셀프보상이 생긴다.",
      "밝은 컨디션으로 사진/기록을 남긴다."
    ]
  };
  const hints = hintMap[card.name]? "\n\n- "+hintMap[card.name].join("\n- ") : "";
  return `선택 카드: ${title}\n\n${body}${hints}`;
}

/* ── 초기화: 과거 기록 복원 or 준비 */
const monthDraw = await findThisMonthDraw();
function showRevToggles(show){
  revUiA.style.display = show? "flex":"none";
  revUiB.style.display = show? "flex":"none";
}
if (monthDraw){
  limitBadge.style.display="inline-block";
  // ✅ 모든 슈트 포함
  const a = DECK.find(x=>x.name===monthDraw.offered?.[0]);
  const b = DECK.find(x=>x.name===monthDraw.offered?.[1]);
  if (a && b){
    offered=[a,b];
    drawFaces(a,b);
    cardA.classList.add("revealed"); cardB.classList.add("revealed");
    showRevToggles(true);
    revA.checked = !!monthDraw.revA; revB.checked = !!monthDraw.revB;
    cardA.classList.toggle("rev-on", revA.checked);
    cardB.classList.toggle("rev-on", revB.checked);
  } else {
    console.warn("⚠️ 복원 실패: 카드 이름을 덱에서 찾을 수 없음", monthDraw.offered);
  }
  revealBtn.disabled=true;
  chooseA.disabled = monthDraw.chosen!=null;
  chooseB.disabled = monthDraw.chosen!=null;
  if (monthDraw.chosen!=null){
    locked=true;
    (monthDraw.chosen===0?cardB:cardA).style.filter="grayscale(1) blur(1px) opacity(.5)";
    const chosenCard = offered[monthDraw.chosen];
    const reversed   = monthDraw.chosen===0 ? !!monthDraw.revA : !!monthDraw.revB;
    reading.textContent = buildReading(chosenCard, reversed);
    resultBox.style.display="block";
  }
}else{
  setRevealAbility();
}
setInterval(setRevealAbility, 30000);

/* ── 이벤트 */
revealBtn.addEventListener("click", async ()=>{
  if (locked) return;
  const [A,B]=pickTwo(); offered=[A,B];
  drawFaces(A,B);
  cardA.classList.add("revealed"); cardB.classList.add("revealed");
  showRevToggles(true); revA.checked=false; revB.checked=false;
  cardA.classList.remove("rev-on"); cardB.classList.remove("rev-on");
  chooseA.disabled=false; chooseB.disabled=false;

  const {error}=await sb.from("tarot_draws").insert({
    user_id:userId, user_name:userName,
    offered:[A.name,B.name], revA:false, revB:false
  });
  if (error) console.error(error);
  limitBadge.style.display="inline-block";
});
revA.addEventListener("change", async ()=>{
  cardA.classList.toggle("rev-on", revA.checked);
  const last=await findThisMonthDraw(); if(last){
    await sb.from("tarot_draws").update({revA:revA.checked}).eq("id", last.id);
  }
});
revB.addEventListener("change", async ()=>{
  cardB.classList.toggle("rev-on", revB.checked);
  const last=await findThisMonthDraw(); if(last){
    await sb.from("tarot_draws").update({revB:revB.checked}).eq("id", last.id);
  }
});

async function finalizeChoice(idx){
  if (!offered || locked) return;
  locked=true;
  chooseA.disabled=true; chooseB.disabled=true;
  (idx===0?cardB:cardA).style.filter="grayscale(1) blur(1px) opacity(.5)";
  const reversed = idx===0 ? revA.checked : revB.checked;
  const chosenCard = offered[idx];

  reading.textContent = buildReading(chosenCard, reversed);
  resultBox.style.display="block";

  const last=await findThisMonthDraw();
  if (last){
    await sb.from("tarot_draws")
      .update({
        chosen: idx,
        chosen_name: chosenCard.name,
        chosen_reversed: reversed
      })
      .eq("id", last.id);
  }
}
chooseA.addEventListener("click", ()=>finalizeChoice(0));
chooseB.addEventListener("click", ()=>finalizeChoice(1));
</script>
</body>
